<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..600&family=Space+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{
    font-family:'Space Grotesk',system-ui,sans-serif;color:#35283c;
    background:
      radial-gradient(120% 80% at 12% 4%, #d9c2ef 0%, rgba(217,194,239,0) 58%),
      radial-gradient(110% 70% at 88% 10%, #f3c3d6 0%, rgba(243,195,214,0) 60%),
      radial-gradient(130% 90% at 78% 52%, #f7c79b 0%, rgba(247,199,155,0) 62%),
      radial-gradient(120% 80% at 20% 92%, #f0ae74 0%, rgba(240,174,116,0) 60%),
      linear-gradient(170deg, #e6d5f4 0%, #f6dcd6 45%, #f6c99e 78%, #eab27b 100%);
    position:relative;
  }
  .glow{position:absolute;border-radius:50%;pointer-events:none}
  .g1{left:2%;top:6%;width:520px;height:520px;
      background:radial-gradient(circle at 40% 40%, rgba(255,255,255,.8), rgba(255,255,255,0) 66%);filter:blur(14px)}
  .g2{right:-4%;top:22%;width:600px;height:460px;
      background:radial-gradient(circle at 60% 45%, rgba(255,255,255,.65), rgba(255,255,255,0) 64%);filter:blur(18px)}
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:0 88px 104px}
  .brand{display:flex;align-items:center;gap:12px;font-family:Newsreader,Georgia,serif;font-size:30px;letter-spacing:.02em;color:#2c2131}
  .brand em{font-style:italic}
  h1{margin:0;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:58px;line-height:1.06;
     color:#2a1f30;max-width:16ch;letter-spacing:-.01em}
  p{margin:0;font-size:24px;font-weight:400;line-height:1.5;color:#4e3f4a;max-width:34ch}
  .foot{position:absolute;left:88px;bottom:58px;display:flex;align-items:center;gap:14px;
        font-family:'DM Mono',ui-monospace,monospace;
        font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:#8a5a12}
  .dot{width:8px;height:8px;border-radius:50%;background:#c9761c}
  .plane{position:absolute;right:88px;bottom:96px;width:230px;height:230px;opacity:.12}
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="wrap">
    <div class="brand"><svg width="40" height="40" viewBox="0 0 100 100" fill="none"><path d="M14 74L34 34l16 26 16-26 20 40" stroke="#2c2131" stroke-width="7"></path><circle cx="86" cy="22" r="6" fill="#c9761c"></circle></svg><span>Ask <em>Maria</em></span></div>
    <h1>Like having a friend who's brilliant at finding flights.</h1>
    <p>She watches your routes, checks the seller, and tells you what she'd actually do.</p>
  </div>
  <div class="foot"><span class="dot"></span><span>Invite-only beta · askmaria.app</span></div>
  <svg class="plane" viewBox="0 0 100 100" fill="none"><path d="M14 74L34 34l16 26 16-26 20 40" stroke="#4b3520" stroke-width="7"></path></svg>
</body>
</html>
