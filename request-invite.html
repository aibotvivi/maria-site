<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://askmaria.app/invite">
<title>Redirecting&hellip; &mdash; Ask Maria</title>
<!-- This page was the signup form until the 2026-09 redesign split it into
     /invite and /confirmed. It stays as a redirect rather than being deleted
     because it is a live, publicly reachable URL that has been handed out —
     deleting it turns someone's bookmark or an older email link into a 404,
     which reads as "this thing is gone", not "this thing moved".

     The query string is carried across: the landing page passes the address
     as ?email=, and dropping it here would make a returning visitor retype
     something we already had. -->
<script>location.replace("invite.html" + location.search + location.hash);</script>
<meta http-equiv="refresh" content="0; url=invite.html">
<style>body{font:16px/1.5 system-ui,sans-serif;margin:3rem auto;max-width:32em;padding:0 1rem;color:#2A2018}</style>
</head>
<body>
<p>This page has moved. <a href="invite.html">Continue to get your link to Maria</a>.</p>
</body>
</html>
